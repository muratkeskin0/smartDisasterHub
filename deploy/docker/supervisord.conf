[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql.err.log

[program:ml]
command=/opt/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000
directory=/app/ml-service/inference
autostart=true
autorestart=true
priority=20
startsecs=30
stdout_logfile=/var/log/supervisor/ml.log
stderr_logfile=/var/log/supervisor/ml.err.log

[program:backend]
command=/docker/start-backend.sh
autostart=true
autorestart=true
priority=30
startsecs=40
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
