spring.application.name=smartDisasterHub

spring.datasource.url=jdbc:mysql://localhost:3306/smart_disaster_hub
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8082

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
jwt.secret=
jwt.expiration=8640000

# Admin User Configuration
app.admin.email=admin@smartdisasterhub.com
app.admin.password=Admin123!
app.admin.firstName=Admin
app.admin.lastName=User

# Default moderation manager (dev seed)
app.manager.email=manager@smartdisasterhub.com
app.manager.password=Manager123!
app.manager.firstName=Moderation
app.manager.lastName=Manager

# web url
app.web.url=http://localhost:4200

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartdisasterhub@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=smartdisasterhub@gmail.com

# ML Service Configuration
app.ml.service.url=http://localhost:8000
app.ml.service.enabled=true

# Geocoding (OpenStreetMap Nominatim — respect ~1 req/s; User-Agent required)
app.geocoding.enabled=true
app.geocoding.nominatim-base-url=https://nominatim.openstreetmap.org/search
app.geocoding.nominatim-reverse-url=https://nominatim.openstreetmap.org/reverse
app.geocoding.user-agent=SmartDisasterHub/1.0 (university graduation project; contact via project maintainer)

# Optional import for local OpenAI config (kept out of git)
spring.config.import=optional:classpath:application-openai.properties,optional:classpath:application-mail-local.properties,optional:classpath:application-secrets-local.properties

# Reddit Configuration
# OAuth (script app) — required since Reddit blocks unauthenticated /new.json with HTTP 403.
# Create app at https://www.reddit.com/prefs/apps (type: script), then set values in application-secrets-local.properties.
app.reddit.user-agent=SmartDisasterHub/1.0 (by /u/smartDisasterHubBot)
app.reddit.client-id=
app.reddit.client-secret=
app.reddit.username=
app.reddit.password=
app.reddit.subreddits=smartDisasterHub
app.reddit.posts-per-subreddit=10
app.reddit.fetch-interval=900000

# Reddit Analysis Job Configuration
# Analysis job runs separately from fetch job
# Initial delay: 1 minute after app start (60000 ms)
# Interval: Every 1 minute (60000 ms)
app.reddit.analysis-enabled=true
app.reddit.analysis-interval=60000
app.reddit.analysis-initial-delay=60000
app.reddit.analysis-batch-size=50

# External AI (chat-completions compatible) config is kept in application-openai.properties (ignored by git)
app.ml.external.enabled=false
app.ml.external.url=
app.ml.external.api-key=
app.ml.external.model=

