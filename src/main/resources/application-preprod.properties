spring.application.name=smartDisasterHub

spring.datasource.url=jdbc:mysql://localhost:3306/smart_disaster_hub_preprod
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8082

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
jwt.secret=
jwt.expiration=8640000

# Admin User Configuration
app.admin.email=admin@smartdisasterhub.com
app.admin.password=Admin123!
app.admin.firstName=Admin
app.admin.lastName=User

app.manager.email=manager@smartdisasterhub.com
app.manager.password=Manager123!
app.manager.firstName=Moderation
app.manager.lastName=Manager

# web url
app.web.url=http://localhost:5173

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartdisasterhub@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=smartdisasterhub@gmail.com