<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#1f2937;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="padding:24px 12px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background:#ffffff;border-radius:10px;padding:28px;">
                <tr>
                    <td>
                        <h2 style="margin:0 0 12px;font-size:22px;">Smart Disaster Hub</h2>
                        <p style="margin:0 0 16px;font-size:15px;">Hello {{FULL_NAME}},</p>
                        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;">
                            We received a request to reset your password. Click the button below to choose a new password.
                            This link expires in 1 hour.
                        </p>
                        <p style="margin:0 0 24px;">
                            <a href="{{RESET_LINK}}" style="display:inline-block;padding:12px 20px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;">
                                Reset Password
                            </a>
                        </p>
                        <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">
                            If you did not request this, you can ignore this email. If the button does not work, copy this link:
                        </p>
                        <p style="margin:0;font-size:13px;word-break:break-all;color:#2563eb;">{{RESET_LINK}}</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
