# Copy as application-secrets-local.properties (ignored by git)
# Fill these values locally only.
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD
jwt.secret=YOUR_JWT_SECRET_HEX_OR_RANDOM_STRING

# Reddit OAuth (script app at https://www.reddit.com/prefs/apps)
# Use a dedicated Reddit account; never commit real credentials.
app.reddit.client-id=YOUR_REDDIT_APP_CLIENT_ID
app.reddit.client-secret=YOUR_REDDIT_APP_SECRET
app.reddit.username=YOUR_REDDIT_USERNAME
app.reddit.password=YOUR_REDDIT_PASSWORD
