spring.application.name=smartDisasterHub

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/${MYSQL_DATABASE:smart_disaster_hub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:sdh}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.initialization-fail-timeout=600000

server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret=${JWT_SECRET:}
jwt.expiration=8640000

app.admin.email=${ADMIN_EMAIL:admin@smartdisasterhub.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.firstName=Admin
app.admin.lastName=User

app.manager.email=${MANAGER_EMAIL:manager@smartdisasterhub.com}
app.manager.password=${MANAGER_PASSWORD:Manager123!}
app.manager.firstName=Moderation
app.manager.lastName=Manager

app.web.url=${APP_WEB_URL:http://localhost}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:smartdisasterhub@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:smartdisasterhub@gmail.com}

app.ml.service.url=http://127.0.0.1:8000
app.ml.service.enabled=true

app.geocoding.enabled=true
app.geocoding.nominatim-base-url=https://nominatim.openstreetmap.org/search
app.geocoding.nominatim-reverse-url=https://nominatim.openstreetmap.org/reverse
app.geocoding.user-agent=SmartDisasterHub/1.0 (university graduation project; contact via project maintainer)

app.reddit.user-agent=${REDDIT_USER_AGENT:SmartDisasterHub/1.0 (by /u/smartDisasterHubBot)}
app.reddit.client-id=${REDDIT_CLIENT_ID:}
app.reddit.client-secret=${REDDIT_CLIENT_SECRET:}
app.reddit.username=${REDDIT_USERNAME:}
app.reddit.password=${REDDIT_PASSWORD:}
app.reddit.subreddits=${REDDIT_SUBREDDITS:smartDisasterHub}
app.reddit.posts-per-subreddit=100
app.reddit.fetch-interval=900000

app.reddit.analysis-enabled=true
app.reddit.analysis-interval=60000
app.reddit.analysis-initial-delay=120000
app.reddit.analysis-batch-size=50

# OpenAI Vision (set OPENAI_API_KEY in .env / docker-compose)
app.openai.enabled=${OPENAI_ENABLED:true}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.responses-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
app.openai.vision-model=${OPENAI_VISION_MODEL:gpt-4.1-mini}
app.openai.vision-timeout-ms=${OPENAI_VISION_TIMEOUT_MS:20000}

# External T1+T2 (OpenAI chat) — mecaz/literal guard; falls back to Python ML on failure
app.ml.external.enabled=${ML_EXTERNAL_ENABLED:true}
app.ml.external.url=${ML_EXTERNAL_URL:https://api.openai.com/v1/chat/completions}
app.ml.external.api-key=${OPENAI_API_KEY:}
app.ml.external.model=${ML_EXTERNAL_MODEL:gpt-4.1-mini}
